esphome:
  name: doorbell
  friendly_name: Türklingel

esp8266:
  board: nodemcuv2

# Logging
logger:

# Home Assistant API (Key aus secrets.yaml)
api:
  encryption:
    key: !secret api_encryption_key

# Over-the-Air Updates (Passwort aus secrets.yaml)
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback-Hotspot (Captive Portal), falls die WLAN-Verbindung fehlschlägt
  ap:
    ssid: "Doorbell Fallback Hotspot"
    password: !secret ap_password

web_server:
  port: 80

# --- Lesen: Klingelsignale (Optokoppler an D4 / D5) ---
binary_sensor:
  - platform: gpio
    pin:
      number: D4
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Klingel Tür"

  - platform: gpio
    pin:
      number: D5
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Klingel Wohnung"

# --- Steuern: vorhandene Tasten kurz "drücken" (500 ms Puls) ---
switch:
  - platform: gpio
    pin: D1
    id: light
    name: "Licht einschalten"
    on_turn_on:
      - delay: 500ms
      - switch.turn_off: light

  - platform: gpio
    pin: D2
    id: door
    name: "Tür öffnen"
    on_turn_on:
      - delay: 500ms
      - switch.turn_off: door
